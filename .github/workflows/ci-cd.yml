name: Build Docker CI

on:
    push:
        branches:
            - main

    workflow_dispatch:

jobs:
    docker:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout source code
            - name: Checkout source code
              uses: actions/checkout@v4

            # 2. Login Docker Hub
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # 3. Build Docker image
            - name: Build Docker image
              run: |
                  docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/streamx-cms-portal:${{ github.sha }} .

            # 4. Push Docker image
            - name: Push Docker image
              run: |
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/streamx-cms-portal:${{ github.sha }}

            # 5. Checkout k8s-manifest repository
            - name: Checkout k8s-manifest repository
              uses: actions/checkout@v4
              with:
                  repository: morris102/streamx-k8s-manifest
                  token: ${{ secrets.MANIFEST_REPO_TOKEN }}

            # 6. Update image tag in manifest
            - name: Update image tag in manifest
              run: |
                  sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" helm/cms-portal/values.yaml
                  git config user.name "morris102"
                  git config user.email "morris102@example.com"
                  git add helm/cms-portal/values.yaml
                  if git diff --cached --quiet; then
                  echo "No changes to commit"
                  exit 0
                  fi
                  git commit -m "chore: update cms-portal image to ${{ github.sha }}"
                  git push origin main
