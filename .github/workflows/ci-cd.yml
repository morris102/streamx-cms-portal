name: Build Docker CI

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get tag from package.json
        id: tag
        uses: devops-actions/action-get-tag@v1.0.3
        with:
          strip_v: true # Optional: Remove 'v' character from version
          default: v0.0.0 # Optional: Default version when tag not found

      - name: Use tag
        run: echo "VERSION=${{steps.tag.outputs.tag}}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 2. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/streamx-cms-portal:${{ env.VERSION }}

      # 5. Checkout k8s-manifest repository
      - name: Checkout k8s-manifest repository
        uses: actions/checkout@v4
        with:
          repository: morris102/streamx-k8s-manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}

      # 6. Update image tag in manifest
      - name: Update image tag in manifest
        run: |
          sed -i "s|tag: .*|tag: \"${{ env.VERSION }}\"|" helm/cms-portal/values.yaml
          git config user.name "morris102"
          git config user.email "morris102@example.com"
          git add helm/cms-portal/values.yaml
          if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
          fi
          git commit -m "chore: update cms-portal image to ${{ env.VERSION }}"
          git push origin main
